services:
  # ── Backend (Laravel) ── internal only, no public port
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    volumes:
      - storage-data:/var/www/html/storage/app/public
    environment:
      APP_NAME: ${APP_NAME:-The Trust Journal}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}

      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}

      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

      NEWS_GENERATION_PROVIDER: ${NEWS_GENERATION_PROVIDER:-openrouter}
      NEWS_GENERATION_MODEL: ${NEWS_GENERATION_MODEL:-perplexity/sonar}
      NEWS_IMAGES_ENABLED: ${NEWS_IMAGES_ENABLED:-false}
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Frontend (Nuxt) ── public facing, gets the domain
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    environment:
      # Nuxt server-side proxy connects to backend via compose-internal network
      NUXT_BACKEND_API_BASE: http://backend:8000
    expose:
      - "3000"
    networks:
      - default

volumes:
  storage-data:

networks:
  coolify:
    external: true