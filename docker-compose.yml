services:
  # ── Backend (Laravel) ── internal only, no public port
  # Runs: php-fpm + nginx + Laravel scheduler + queue worker via supervisord
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    volumes:
      - storage-data:/var/www/html/storage/app/public
    environment:
      # App
      APP_NAME: ${APP_NAME:-The Neural Journal}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      # Coolify injects SERVICE_URL_FRONTEND/SERVICE_FQDN_FRONTEND; use them as the
      # authoritative public domain so sitemaps/feeds/robots don't use localhost.
      APP_URL: ${SERVICE_URL_FRONTEND:-${APP_URL:-http://localhost}}
      FRONTEND_URL: ${SERVICE_URL_FRONTEND:-${FRONTEND_URL:-${APP_URL:-http://localhost}}}

      # Database (Coolify-managed Postgres)
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis (URL-only config; individual REDIS_HOST/PORT/PASSWORD are intentionally omitted so REDIS_URL wins)
      REDIS_URL: ${REDIS_URL}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
      REDIS_QUEUE_DB: ${REDIS_QUEUE_DB:-2}

      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}

      # Logging
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-warning}

      # Sanctum
      SANCTUM_TOKEN_EXPIRATION: ${SANCTUM_TOKEN_EXPIRATION:-1440}

      # Set to false to skip auto-migrate on container boot
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}

      # AI / LLM providers
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-ollama_cloud}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY}
      OLLAMA_CLOUD_BASE_URL: ${OLLAMA_CLOUD_BASE_URL:-https://api.ollama.com}

      # News discovery & generation
      NEWS_GENERATION_ENABLED: ${NEWS_GENERATION_ENABLED:-true}
      NEWS_GENERATION_PROVIDER: ${NEWS_GENERATION_PROVIDER:-ollama_cloud}
      NEWS_GENERATION_MODEL: ${NEWS_GENERATION_MODEL:-gemma4:31b-cloud}
      NEWS_GENERATION_TIMEOUT: ${NEWS_GENERATION_TIMEOUT:-300}

      NEWS_DISCOVERY_LIMIT: ${NEWS_DISCOVERY_LIMIT:-5}
      NEWS_DISCOVERY_FRESH_HOURS: ${NEWS_DISCOVERY_FRESH_HOURS:-12}
      NEWS_DISCOVERY_SOURCES_PER_TOPIC: ${NEWS_DISCOVERY_SOURCES_PER_TOPIC:-5}
      NEWS_DISCOVERY_SOURCES: ${NEWS_DISCOVERY_SOURCES:-google_rss,brave_search}
      NEWS_DISCOVERY_PROVIDER: ${NEWS_DISCOVERY_PROVIDER:-google_rss}
      NEWS_DISCOVERY_BRAVE_FALLBACK_THRESHOLD: ${NEWS_DISCOVERY_BRAVE_FALLBACK_THRESHOLD:-8}

      BRAVE_SEARCH_ENABLED: ${BRAVE_SEARCH_ENABLED:-true}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY}
      BRAVE_SEARCH_BASE_URL: ${BRAVE_SEARCH_BASE_URL:-https://api.search.brave.com/res/v1}
      BRAVE_SEARCH_TIMEOUT: ${BRAVE_SEARCH_TIMEOUT:-20}
      BRAVE_SEARCH_LANG: ${BRAVE_SEARCH_LANG:-en}
      BRAVE_SEARCH_FRESHNESS: ${BRAVE_SEARCH_FRESHNESS:-pw}
      BRAVE_SEARCH_MAX_URLS: ${BRAVE_SEARCH_MAX_URLS:-20}
      BRAVE_SEARCH_MAX_TOKENS: ${BRAVE_SEARCH_MAX_TOKENS:-8192}

      # Images
      NEWS_IMAGES_ENABLED: ${NEWS_IMAGES_ENABLED:-true}
      NEWS_SOURCE_IMAGES_ENABLED: ${NEWS_SOURCE_IMAGES_ENABLED:-true}
      NEWS_AI_IMAGE_ENABLED: ${NEWS_AI_IMAGE_ENABLED:-false}

      # Google AdSense (empty = no ads shown)
      ADSENSE_CLIENT: ${ADSENSE_CLIENT:-}
      ADSENSE_SLOT: ${ADSENSE_SLOT:-}

      # Mail (optional, for admin notifications)
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@theneuraljournal.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-"The Neural Journal"}

      # Supervisor tuning
      SCHEDULER_START_DELAY: ${SCHEDULER_START_DELAY:-60}
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 512m
    cpus: 2

  # ── Frontend (Nuxt) ── public facing, gets the domain in Coolify
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    environment:
      # Nuxt server-side proxy connects to backend via compose-internal network
      NUXT_BACKEND_API_BASE: http://backend:8000
      ADSENSE_CLIENT: ${ADSENSE_CLIENT:-}
      ADSENSE_SLOT: ${ADSENSE_SLOT:-}
    expose:
      - "3000"
    networks:
      - default
      - coolify
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 1

volumes:
  storage-data:

networks:
  coolify:
    external: true
